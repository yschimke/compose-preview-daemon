org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
org.gradle.caching=true

# Build-cache salt — an extra declared input on every Kotlin compilation task, so bumping this
# number moves the whole repo to fresh build-cache keys (see ComposeAiBaseConventionsPlugin).
composeai.cacheSalt=1

# Kill switch for the BuildFetch remote build cache. `off` skips it entirely; the local cache
# stays on. See settings.gradle.kts.
composeai.remoteCache=on

android.useAndroidX=true

# Workaround for Gradle 9 and Kotlin plugin compatibility issue, should be removed when fixed and won't be supported in Gradle 10
org.gradle.configuration-cache.unsafe.ignore.unsupported-build-events-listeners=true

# Compose Multiplatform auto-applies a hot-reload sub-plugin that breaks the configuration cache.
# We don't use hot reload, so disable it.
org.jetbrains.compose.hot.reload.disable=true

# Publish only the MD5 and SHA-1 checksums Maven Central requires, not Gradle's extra SHA-256 and
# SHA-512 files. Nothing resolves them, yet each one is an extra upload counted against the Central
# Portal's deployment quotas — two more files for every jar, sources jar, javadoc jar, POM, module
# file and `.asc` signature. Read by the publish task at execution time, so it covers snapshot and
# release uploads alike. Gradle plans to make this the default in Gradle 10, at which point this
# line can go: https://github.com/gradle/gradle/issues/39582
systemProp.org.gradle.internal.publish.checksums.insecure=true
