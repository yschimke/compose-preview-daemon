name: 'Setup JDK + Gradle'
description: >
  Install Temurin JDK 17 and configure gradle/actions/setup-gradle with the
  action versions pinned consistently across this repo. Centralised so
  dependabot only has to bump these in one place.

inputs:
  cache-provider:
    description: >
      Cache provider for gradle/actions/setup-gradle. Keep the default on the
      MIT-licensed basic provider rather than Gradle Actions v6's enhanced
      provider.
    default: 'basic'
  cache-read-only:
    description: >
      Pass 'true' in release/publish jobs to prevent Gradle cache writes —
      avoids cache poisoning from untrusted PR runs reading those entries
      on subsequent workflow invocations. (zizmor: cache-poisoning)
      Unset, pull requests read the cache and everything else writes it.

      Unset used to mean 'false' everywhere, and the Gradle User Home cache
      never restored, on `main` included: every PR job saved its own
      multi-gigabyte, PR-scoped entry, which only that PR can read, and those
      crowded the repository's cache quota while `main`'s entries were evicted.
      A PR restores `main`'s entry instead, the same as setup-gradle's own default.
    default: ''

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: 17.0.20+101
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        cache-provider: ${{ inputs.cache-provider }}
        cache-read-only: ${{ inputs.cache-read-only != '' && inputs.cache-read-only || github.event_name == 'pull_request' }}
