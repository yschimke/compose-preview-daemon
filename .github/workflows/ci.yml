name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every module's unit tests, plus the ABI dumps. `jvmTest` alongside `test`
  # because a Kotlin Multiplatform module names its JVM tests that way and registers no `test`;
  # `checkKotlinAbi` unqualified so Gradle runs it wherever a module declares `abiValidation()`.
  # `--continue` so one red module reports every other module's result in the same run.
  module-unit-tests:
    name: Module Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/buildfetch-cache
        with:
          rw-token: ${{ github.event_name == 'push' && (secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN) || '' }}
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      # Robolectric fetches its `android-all-instrumented` framework jars (SDK 33, 34 and 35 here)
      # into `~/.m2` at test time, outside the Gradle User Home that setup-gradle caches, so every
      # run downloaded them again. Same scheme as compose-ai-tools' integration.yml: restore by
      # prefix, save under a key naming the exact jar set, and only from `main`.
      - name: Restore Robolectric android-all cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: android-all-instrumented-${{ runner.os }}-${{ github.job }}-
          restore-keys: |
            android-all-instrumented-${{ runner.os }}-${{ github.job }}-
      # Robolectric skips the download when the jar's path exists, so a truncated jar restored from
      # cache would boot a broken sandbox rather than be fetched again. Drop any that fail to open.
      - name: Drop corrupt android-all jars
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          root = Path.home() / ".m2/repository/org/robolectric/android-all-instrumented"
          for jar in root.rglob("*.jar") if root.exists() else []:
              try:
                  zipfile.ZipFile(jar).close()
              except (zipfile.BadZipFile, OSError) as e:
                  print(f"dropping {jar}: {e}")
                  jar.unlink()
          PY
      - name: Test build ownership checks
        run: ./gradlew -p build-logic test
      # `:daemon:android:test` has a runner of its own (`daemon-android-tests`): it was the whole
      # tail of this job, 9-13 minutes of one Robolectric boot per test class.
      - name: Run module tests
        run: >-
          ./gradlew test jvmTest checkKotlinAbi checkDependencyOwnership checkHttpServerFloor
          -x :daemon:android:test --continue
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-unit-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 7
      - name: Name the android-all jar set
        id: android-all
        if: always() && github.event_name == 'push'
        run: |
          dir="${HOME}/.m2/repository/org/robolectric/android-all-instrumented"
          if [ -d "$dir" ] && [ -n "$(find "$dir" -name '*.jar' -print -quit)" ]; then
            coordinate=$(cd "$dir" && find . -name '*.jar' | sort | sha256sum | cut -c1-16)
            echo "coordinate=${coordinate}" >> "$GITHUB_OUTPUT"
          fi
      # Saving a key that already exists only warns: the steady state, since the set rarely moves.
      - name: Save Robolectric android-all cache
        if: always() && steps.android-all.outputs.coordinate != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: android-all-instrumented-${{ runner.os }}-${{ github.job }}-${{ steps.android-all.outputs.coordinate }}

  # The Robolectric-backed daemon tests, split out of `module-unit-tests` so the two run side by
  # side. One JVM per test class (`forkEvery`, see `daemon/android/build.gradle.kts`), two at a time
  # on a 4-core runner.
  daemon-android-tests:
    name: Daemon Android Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/buildfetch-cache
        with:
          rw-token: ${{ github.event_name == 'push' && (secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN) || '' }}
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      # Robolectric fetches its `android-all-instrumented` framework jars (SDK 33, 34 and 35 here)
      # into `~/.m2` at test time, outside the Gradle User Home that setup-gradle caches, so every
      # run downloaded them again. Same scheme as compose-ai-tools' integration.yml: restore by
      # prefix, save under a key naming the exact jar set, and only from `main`.
      - name: Restore Robolectric android-all cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: android-all-instrumented-${{ runner.os }}-${{ github.job }}-
          restore-keys: |
            android-all-instrumented-${{ runner.os }}-${{ github.job }}-
      # Robolectric skips the download when the jar's path exists, so a truncated jar restored from
      # cache would boot a broken sandbox rather than be fetched again. Drop any that fail to open.
      - name: Drop corrupt android-all jars
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          root = Path.home() / ".m2/repository/org/robolectric/android-all-instrumented"
          for jar in root.rglob("*.jar") if root.exists() else []:
              try:
                  zipfile.ZipFile(jar).close()
              except (zipfile.BadZipFile, OSError) as e:
                  print(f"dropping {jar}: {e}")
                  jar.unlink()
          PY
      - name: Run daemon Android tests
        run: ./gradlew :daemon:android:test
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daemon-android-test-reports
          path: |
            daemon/android/build/reports/tests/**
            daemon/android/build/test-results/**
          retention-days: 7
      - name: Name the android-all jar set
        id: android-all
        if: always() && github.event_name == 'push'
        run: |
          dir="${HOME}/.m2/repository/org/robolectric/android-all-instrumented"
          if [ -d "$dir" ] && [ -n "$(find "$dir" -name '*.jar' -print -quit)" ]; then
            coordinate=$(cd "$dir" && find . -name '*.jar' | sort | sha256sum | cut -c1-16)
            echo "coordinate=${coordinate}" >> "$GITHUB_OUTPUT"
          fi
      # Saving a key that already exists only warns: the steady state, since the set rarely moves.
      - name: Save Robolectric android-all cache
        if: always() && steps.android-all.outputs.coordinate != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: android-all-instrumented-${{ runner.os }}-${{ github.job }}-${{ steps.android-all.outputs.coordinate }}

  # Android lint, which nothing enforced until now: `lintDebug` was green on nobody's machine and
  # red on `main` for 102 `NewApi` errors (#136) plus 21 others (#137) before those landed, because
  # the only thing that ran it was a contributor happening to run `check` locally. Both are fixed,
  # so this is the gate that keeps them fixed.
  #
  # `lintDebug` rather than `lint` or `lintRelease`: it is the task every Android module in this
  # build actually registers (17 of them — the rest are plain JVM or KMP and have no lint task at
  # all), and naming the variant keeps the result independent of which variant AGP would otherwise
  # pick. Unqualified so a new Android module is covered the day it is added.
  #
  # `--continue` for the same reason `module-unit-tests` uses it: lint aborts the build on the first
  # module with errors, and one red module should not hide the other sixteen's results.
  android-lint:
    name: Android Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/buildfetch-cache
        with:
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      - name: Run Android lint
        run: ./gradlew lintDebug --continue
      - name: Upload lint reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-lint-reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.sarif
            **/build/intermediates/lint_intermediate_text_report/**
          retention-days: 7

  # The two sidecar archives a release ships, built on every PR so a packaging regression is
  # caught before the tag, and the Skiko-native check that guards the desktop one.
  sidecars:
    name: Sidecar archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/buildfetch-cache
        with:
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      - name: Package the sidecars
        run: ./gradlew :distribution:packageAndroidDaemon :distribution:packageDesktopDaemon
      - name: List the archives
        run: ls -la distribution/build/distributions/

  # The Kotlin mirrors of `schema/spatial-scene.schema.json` (`:preview-data-api`) and
  # `schema/xr-render-service.schema.json` (`:renderer-xr-client`) are generated; a schema edit
  # without a regenerate is a drift that only this catches.
  schema-codegen:
    name: Schema codegen up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Test automated Gradle launcher
        run: .github/scripts/test-agent-gradle.sh
      # The plan only runs during a release, where both failure directions are quiet: too broad
      # re-uploads every coordinate, too narrow skips a module Central cannot take a second time.
      - name: Test the Maven publish plan
        run: .github/scripts/test-maven-publish-plan.sh
      - run: node scripts/codegen/gen-spatial-scene.mjs --check
      - run: node scripts/codegen/gen-xr-render-service.mjs --check
