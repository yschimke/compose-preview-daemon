name: Release PR

# release-please opens and maintains the release PR from Conventional Commit titles on main
# (PRs are squash-merged, so the PR title is the commit). Merging it creates the tag and a draft
# GitHub Release; `release.yml` then publishes Maven Central and uploads the sidecar archives.
# The release PR itself is written by `update-release-pr`, after the release is published.
# Every release here is a minor: a `!` in a title does not bump the major (pr-title.yml rejects it).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "release-please-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create tags + GitHub Releases
      pull-requests: write   # open/update the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Only cut the release here. In the same invocation release-please would also open the
          # next release PR, but the release it just cut is a draft, which release-please cannot
          # see: it falls back to older history and opens a PR listing every commit back to the
          # bootstrap (#200, and the PR after every release before it). `update-release-pr` runs
          # the PR half once the release is published.
          skip-github-pull-request: true

      # A *draft* GitHub Release does NOT create its git tag: GitHub only writes the tag ref when
      # the release is published. But `release.yml` checks out `ref: <tag>`, so create the tag
      # now, at the release PR's merge commit. Idempotent: skips if the ref already exists (a
      # re-run, or a future non-draft release-please). v3.0.0 was cut without this step and both
      # publish jobs died at checkout on the missing tag.
      #
      # `!cancelled()` rather than the default success-only gate: once the action reports
      # `release_created=true`, a later failure must not skip tag creation, or the manifest names
      # a version with no tag and later runs re-list old history.
      - name: Ensure the release tag exists for the draft
        if: ${{ !cancelled() && steps.rp.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} already exists — leaving it."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" -f sha="${SHA}"
            echo "created tag ${TAG} at ${SHA}."
          fi

  release:
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    # A called workflow's jobs may not request more than the calling job holds; anything omitted
    # here is `none` for every job in `release.yml`, and asking for more than `none` fails the
    # whole run at startup, before a single job is created. That is not hypothetical: when
    # `record-published` arrived wanting `pull-requests: write` and this block did not grant it,
    # the next two pushes to main died as `startup_failure`, which is why v3.6.1 merged its release
    # PR and was never tagged or published.
    #
    # `pull-requests: write` is gone with that job -- the publish plan reads its baseline from
    # Maven Central now and writes nothing back. Keep this in step with the job `permissions`
    # blocks in `release.yml`.
    permissions:
      contents: write

  # The PR half of release-please: open or update the next release PR. On an ordinary push it runs
  # straight away; on the release run it waits for `release`, which un-drafts the release, so
  # release-please baselines on the version just released instead of re-listing history.
  #
  # `release_created != 'true'` says only that THIS run cut nothing, not that no release is
  # publishing in another run, so the race guard asks before and after. A release that failed and
  # stays a draft blocks nothing for long: the guard treats it as stranded after two hours.
  update-release-pr:
    needs: [release-please, release]
    if: >-
      ${{ !cancelled()
      && (needs.release-please.outputs.release_created != 'true'
      || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write        # update the release branch
      pull-requests: write   # open/update the release PR
    outputs:
      pr: ${{ steps.rp.outputs.pr }}
      in_flight: ${{ steps.preflight.outputs.in_flight }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check whether a release is in flight
        id: preflight
        env:
          MODE: check
        run: ./.github/scripts/release-pr-race-guard.sh

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        if: ${{ steps.preflight.outputs.in_flight != 'true' }}
        # The failure this tolerates is the race's own: updating a release PR that merged out from
        # under it. The last step re-raises anything else.
        continue-on-error: true
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Discard a release PR the race produced
        id: repair
        if: ${{ always() && steps.preflight.outputs.in_flight != 'true' }}
        env:
          MODE: repair
          RP_PR: ${{ steps.rp.outputs.pr }}
        run: ./.github/scripts/release-pr-race-guard.sh

      - name: Re-raise a release-please failure the race does not explain
        if: ${{ always() && steps.rp.outcome == 'failure' && steps.repair.outputs.raced != 'true' }}
        run: |
          echo "::error::release-please failed and no release was in flight — see the step above."
          exit 1

  # Which Maven coordinates merging the release PR would publish, as one comment on that PR. The
  # publish plan only runs inside the release, so until now the answer -- anywhere from nothing to
  # all 70 modules -- was visible only after the irreversible upload. Same script, same Maven
  # Central baseline, run against the release PR's head; see
  # `.github/scripts/release-pr-publish-plan.sh`. Informational: it never fails. It follows
  # `update-release-pr`, so it annotates the PR that pass just wrote, and it skips while a
  # release is in flight because that PR is about to be rewritten.
  release-pr-publish-plan:
    needs: update-release-pr
    if: ${{ !cancelled() && needs.update-release-pr.result == 'success' && needs.update-release-pr.outputs.in_flight != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # create/edit the comment on the release PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Comment the publish plan on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          RP_PR: ${{ needs.update-release-pr.outputs.pr }}
        run: ./.github/scripts/release-pr-publish-plan.sh
