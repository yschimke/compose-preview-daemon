name: Release

# Publishes every module to Maven Central at the tag's version and attaches the two sidecar
# archives to the GitHub Release. One version line: the `data/*` modules release with the
# renderers they change alongside (see the root build's `printPublishTasks`).

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      MAVEN_CENTRAL_USERNAME:
        required: true
      MAVEN_CENTRAL_PASSWORD:
        required: true
      SIGNING_KEY:
        required: true
      SIGNING_KEY_ID:
        required: true
      SIGNING_KEY_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

env:
  TAG_NAME: ${{ inputs.tag }}

jobs:
  publish-maven:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    # Read-only: this job uploads to Central and writes nothing back to the repository. The
    # baseline it plans against comes from Central itself, so there is nothing to record.
    # `fetch-depth: 0` because the plan below diffs each module against the tag it last published
    # at, which a shallow clone cannot reach.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-read-only: 'true'
      - name: Derive the version from the tag
        run: echo "PLUGIN_VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"
      # Which modules this release actually has to upload. A module is published when it changed
      # since the tag IT last published at, when something it depends on is publishing, or when a
      # shared build input moved. Everything else keeps the version it is already on Central at,
      # and `:bom` records the whole set.
      #
      # `workflow_dispatch` publishes everything: a recovery re-run is exactly the case where the
      # manifest may already describe the release being repaired, so the plan's baseline cannot be
      # trusted and the old all-modules behaviour is the safe one.
      - name: Plan the publish
        id: plan
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "recovery run: publishing every module" >&2
            echo "planned=false" >> "$GITHUB_OUTPUT"
            echo "set=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --tags --quiet
          # `--write-manifest` puts the baseline the plan resolved from Central into the workspace,
          # where the Gradle build reads it to give a skipped module the version it is already
          # published at. Written, never committed: Central is the source of truth, and a copy in
          # git was wrong for the two hours between a release and its write-back landing.
          plan=$(./.github/scripts/maven-publish-plan.sh --head "$TAG_NAME" \
            --write-manifest publishing-manifest.json | paste -sd, -)
          echo "planned: ${plan:-<nothing>}" >&2
          echo "planned=true" >> "$GITHUB_OUTPUT"
          echo "set=$plan" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          PUBLISH_SET: ${{ steps.plan.outputs.set }}
          PLANNED: ${{ steps.plan.outputs.planned }}
        run: |
          set -euo pipefail
          args=(--no-configuration-cache)
          # PLANNED is "false" only on the recovery path, where no plan ran and everything
          # publishes. Otherwise the property is ALWAYS passed, including when the plan is empty:
          # an absent property means "publish everything", an empty one means "publish nothing",
          # and collapsing the two would upload all 69 coordinates on exactly the
          # releases that need none of them.
          if [ "${PLANNED}" = "true" ]; then
            args+=("-Pcomposeai.publishSet=${PUBLISH_SET}")
          fi
          mapfile -t tasks < <(./gradlew --quiet printPublishTasks "${args[@]}" | cut -f1)
          # An empty task list is valid only for a planned-empty release. A bare `./gradlew` is not
          # a no-op that fails loudly — this build declares no `defaultTasks`, so it runs `help` and
          # exits 0 — therefore retain the failure for an unplanned/recovery release.
          if [ "${#tasks[@]}" -eq 0 ]; then
            if [ "${PLANNED}" = "true" ]; then
              echo "no Maven artifacts changed; skipping Central publication"
              exit 0
            fi
            echo "::error::no publish tasks resolved; refusing to run a bare ./gradlew" >&2
            exit 1
          fi
          printf 'publishing %d task(s):\n' "${#tasks[@]}" >&2
          printf '  %s\n' "${tasks[@]}" >&2
          ./gradlew "${tasks[@]}" "${args[@]}"


  sidecars:
    name: Package sidecars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-read-only: 'true'
      - name: Derive the version from the tag
        run: echo "PLUGIN_VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"
      - name: Package
        run: ./gradlew :distribution:packageAndroidDaemon :distribution:packageDesktopDaemon
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sidecars
          path: |
            distribution/build/distributions/*.zip
            distribution/build/distributions/*.tar.gz

  release:
    name: Attach assets to the release
    needs: [publish-maven, sidecars]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload or create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" --clobber artifacts/*.zip artifacts/*.tar.gz
            gh release edit "$TAG_NAME" --draft=false
          else
            gh release create "$TAG_NAME" --title "compose-preview-daemon ${TAG_NAME#v}" \
              --generate-notes artifacts/*.zip artifacts/*.tar.gz
          fi
