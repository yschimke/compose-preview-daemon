name: Release

# Publishes every module to Maven Central at the tag's version and attaches the two sidecar
# archives to the GitHub Release. One version line: the `data/*` modules release with the
# renderers they change alongside (see the root build's `printPublishTasks`).

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      MAVEN_CENTRAL_USERNAME:
        required: true
      MAVEN_CENTRAL_PASSWORD:
        required: true
      SIGNING_KEY:
        required: true
      SIGNING_KEY_ID:
        required: true
      SIGNING_KEY_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

env:
  TAG_NAME: ${{ inputs.tag }}

jobs:
  publish-maven:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    # Read-only: this job uploads to Central and writes nothing back to the repository. The
    # manifest is recorded by `record-published` below, which has its own credentials.
    # `fetch-depth: 0` because the plan below diffs each module against the tag it last published
    # at, which a shallow clone cannot reach.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-read-only: 'true'
      - name: Derive the version from the tag
        run: echo "PLUGIN_VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"
      # Which modules this release actually has to upload. A module is published when it changed
      # since the tag IT last published at, when something it depends on is publishing, or when a
      # shared build input moved. Everything else keeps the version it is already on Central at,
      # and `:bom` records the whole set.
      #
      # `workflow_dispatch` publishes everything: a recovery re-run is exactly the case where the
      # manifest may already describe the release being repaired, so the plan's baseline cannot be
      # trusted and the old all-modules behaviour is the safe one.
      - name: Plan the publish
        id: plan
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "recovery run: publishing every module" >&2
            echo "planned=false" >> "$GITHUB_OUTPUT"
            echo "set=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --tags --quiet
          plan=$(./.github/scripts/maven-publish-plan.sh --head "$TAG_NAME" | paste -sd, -)
          echo "planned: ${plan:-<nothing>}" >&2
          echo "planned=true" >> "$GITHUB_OUTPUT"
          echo "set=$plan" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          PUBLISH_SET: ${{ steps.plan.outputs.set }}
          PLANNED: ${{ steps.plan.outputs.planned }}
        run: |
          set -euo pipefail
          args=(--no-configuration-cache)
          # PLANNED is "false" only on the recovery path, where no plan ran and everything
          # publishes. Otherwise the property is ALWAYS passed, including when the plan is empty:
          # an absent property means "publish everything", an empty one means "publish nothing but
          # the BOM", and collapsing the two would upload all 69 coordinates on exactly the
          # releases that need none of them.
          if [ "${PLANNED}" = "true" ]; then
            args+=("-Pcomposeai.publishSet=${PUBLISH_SET}")
          fi
          mapfile -t tasks < <(./gradlew --quiet printPublishTasks "${args[@]}" | cut -f1)
          ./gradlew "${tasks[@]}" "${args[@]}"

    outputs:
      publish-set: ${{ steps.plan.outputs.set }}
      planned: ${{ steps.plan.outputs.planned }}

  # Recording what published is bookkeeping, and it runs in its OWN job for one reason: a Maven
  # upload cannot be undone, so nothing after it may be able to fail the release.
  #
  # It used to be the last step of `publish-maven`, and on the very first reduced-publish release
  # (v3.6.0) it did exactly the damage that arrangement allows. The upload succeeded, the manifest
  # was written, and then the push was refused -- `main` is protected by a ruleset requiring changes
  # to arrive through a pull request. That failed the whole job, which `release` needs, so the
  # sidecars never attached and v3.6.0 stayed a draft with no assets: a finished publish behind an
  # unfinished release, over a JSON file.
  #
  # So: its own job, `continue-on-error`, and the manifest arrives by pull request like every other
  # change to `main`. A stale manifest is survivable -- the plan diffs each module against an older
  # tag and republishes something that did not need it, which costs quota and never breaks a
  # consumer. A blocked release is not.
  record-published:
    name: Record published versions
    needs: publish-maven
    if: ${{ github.event_name != 'workflow_dispatch' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The default branch, not the tag: the manifest is repository state, and a commit on a
      # detached tag has nowhere to land.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - name: Record and open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_SET: ${{ needs.publish-maven.outputs.publish-set }}
        run: |
          set -euo pipefail
          python3 .github/scripts/record-published.py \
            --version "${TAG_NAME#v}" --modules "${PUBLISH_SET}"
          if git diff --quiet -- publishing-manifest.json; then
            echo "manifest unchanged"
            exit 0
          fi
          branch="chore/record-published-${TAG_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add publishing-manifest.json
          git commit -m "chore: record published versions for ${TAG_NAME}"
          git push -u origin "$branch"
          gh pr create \
            --title "chore: record published versions for ${TAG_NAME}" \
            --body "Records what ${TAG_NAME} actually uploaded, so the next release diffs each module against its own last publish rather than an older tag. Generated by the release job; see .github/scripts/maven-publish-plan.sh." \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch"

  sidecars:
    name: Package sidecars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-read-only: 'true'
      - name: Derive the version from the tag
        run: echo "PLUGIN_VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"
      - name: Package
        run: ./gradlew :distribution:packageAndroidDaemon :distribution:packageDesktopDaemon
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sidecars
          path: |
            distribution/build/distributions/*.zip
            distribution/build/distributions/*.tar.gz

  release:
    name: Attach assets to the release
    needs: [publish-maven, sidecars]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload or create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" --clobber artifacts/*.zip artifacts/*.tar.gz
            gh release edit "$TAG_NAME" --draft=false
          else
            gh release create "$TAG_NAME" --title "compose-preview-daemon ${TAG_NAME#v}" \
              --generate-notes artifacts/*.zip artifacts/*.tar.gz
          fi
